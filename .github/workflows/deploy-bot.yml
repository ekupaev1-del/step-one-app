name: Deploy Bot to Server

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'bot/**'
      - '.github/workflows/deploy-bot.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Bot
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        working-directory: ./bot
        run: npm ci

      - name: Build project
        working-directory: ./bot
        run: npm run build

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BOT_SERVER_HOST }}
          username: ${{ secrets.BOT_SERVER_USER }}
          key: ${{ secrets.BOT_SERVER_SSH_KEY }}
          port: ${{ secrets.BOT_SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting bot deployment..."
            
            # Navigate to project directory
            cd ${{ secrets.BOT_SERVER_PATH }}/bot || { echo "❌ Directory not found"; exit 1; }
            
            # Pull latest code
            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            git clean -fd
            
            # Install dependencies
            echo "📦 Installing dependencies..."
            npm ci --production
            
            # Build project
            echo "🔨 Building project..."
            npm run build
            
            # Restart bot with PM2
            echo "🔄 Restarting bot..."
            pm2 restart step-one-bot || pm2 start ecosystem.production.config.js --name step-one-bot || {
              echo "⚠️ PM2 restart failed, trying to start fresh..."
              pm2 delete step-one-bot 2>/dev/null || true
              pm2 start ecosystem.production.config.js --name step-one-bot
            }
            
            # Save PM2 process list
            pm2 save
            
            # Show status
            echo "📊 Bot status:"
            pm2 status step-one-bot
            
            echo "✅ Deployment completed successfully!"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BOT_SERVER_HOST }}
          username: ${{ secrets.BOT_SERVER_USER }}
          key: ${{ secrets.BOT_SERVER_SSH_KEY }}
          port: ${{ secrets.BOT_SERVER_PORT || 22 }}
          script: |
            pm2 logs step-one-bot --lines 20 --nostream || echo "⚠️ Could not fetch logs"
