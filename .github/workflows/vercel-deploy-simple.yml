# Упрощенный вариант деплоя через Vercel CLI
# Использует официальный Vercel Action для более надежного деплоя

name: Deploy to Vercel (Simple)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'miniapp/**'
      - 'supabase/migrations/**'
      - '.github/workflows/**'
      - 'vercel.json'
      - 'miniapp/vercel.json'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'miniapp/**'
      - 'supabase/migrations/**'
      - '.github/workflows/**'
      - 'vercel.json'
      - 'miniapp/vercel.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: miniapp/package-lock.json
      
      - name: Install dependencies
        working-directory: ./miniapp
        run: npm ci
      
      - name: Build project
        working-directory: ./miniapp
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: ${{ github.event_name == 'pull_request' && '--preview' || '--prod' }}
          working-directory: ./miniapp
          scope: ${{ secrets.VERCEL_ORG_ID }}
